[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ufc-quant"
version = "0.1.0"
description = "Probabilités de victoire UFC, comparaison au marché et backtest sous contraintes de risque (projet académique)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5", "scipy>=1.11", "pyarrow>=15",
  "PyYAML>=6", "requests>=2.31", "python-dotenv>=1.0",
  "streamlit>=1.35", "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ufc_quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
